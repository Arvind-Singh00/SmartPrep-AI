services:
  - type: web
    name: smartprep-backend
    env: node
    plan: free
    region: oregon
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # ⚠️ Set the following secret values in Render Dashboard → Environment
      # (never store real secrets in this file)
      - key: MONGODB_URI
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # min 32 chars, e.g. use: openssl rand -hex 32
      - key: JWT_REFRESH_SECRET
        sync: false   # min 32 chars, different from JWT_SECRET
      - key: GEMINI_API_KEY
        sync: false   # from https://aistudio.google.com/app/apikey
      - key: GROQ_API_KEY
        sync: false   # from https://console.groq.com/keys
      # CORS_ORIGIN must match your frontend's exact Render URL
      - key: CORS_ORIGIN
        value: https://smartprep-frontend.onrender.com
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

  - type: web
    name: smartprep-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: "npm install && npx vite build"
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smartprep-ai-61yc.onrender.com/api
      - key: VITE_USE_MOCK
        value: false
